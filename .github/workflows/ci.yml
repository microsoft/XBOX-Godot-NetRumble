name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # NetRumble is the reference sample for Microsoft GDK and PlayFab integration
  # in Godot. It must explain the platform on its own terms rather than by
  # comparison to any previous implementation. This job keeps that true over
  # time instead of relying on a one-time cleanup.
  #
  # Pure text analysis: no engine, no SDK, no secrets. It is the hard gate.
  # ---------------------------------------------------------------------------
  deport-lint:
    name: Sample voice
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for port framing
        shell: pwsh
        run: .\tools\check-deport.ps1 -Detailed

  # ---------------------------------------------------------------------------
  # MicrosoftGame.config fails quietly. A malformed file makes GDK.initialize()
  # return an HRESULT and nothing else: the game keeps running with every
  # platform service unavailable, and Godot still exits 0 -- so the parse job
  # below cannot catch it. The export-time hazards are just as quiet, producing
  # a mis-named binary or an aborted package rather than an error.
  #
  # Each rule this runs mirrors a hazard documented in the config's own comment
  # block, so the warnings there are enforced rather than merely written down.
  #
  # Pure text analysis: no engine, no SDK, no secrets. It is a hard gate.
  # ---------------------------------------------------------------------------
  game-config:
    name: Game config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate MicrosoftGame.config
        shell: pwsh
        run: .\tools\check-game-config.ps1

  # ---------------------------------------------------------------------------
  # Runs isolated account-save behavior tests, then parses/imports every script
  # and scene. The full-project pass catches broken references, renamed autoloads
  # and scenes that no longer resolve; neither check proves live SDK or networking
  # behavior.
  #
  # addons/ is gitignored build output, and the GDExtensions have to load for the
  # project to import. The installed addons/ tree is cached under a key made of
  # everything that decides it: the submodule pin, the install script and the
  # .gdextension overrides. A PR that touches none of those restores the tree
  # main already built and skips the native build; a PR that changes the pin or
  # an addon input builds from source. -SkipConsoleRedist is required for that
  # build: the addon build gets its GDK through vcpkg, but the GRDK console
  # redistributables come from a Microsoft GDK *installation*, which a hosted
  # runner does not have. Those two DLLs matter only to the Xbox export, which
  # this job does not perform.
  #
  # GODOT_ADDON_SUPPRESS_TELEMETRY keeps the addons' initialization telemetry
  # out of CI runs, as upstream does for its own validation.
  #
  # Advisory for now. Whether a hosted runner can initialize the GDK runtime has
  # not been confirmed. Once this has been observed passing on a runner, drop
  # `continue-on-error` to make it a required gate. If a hosted runner turns out
  # to be insufficient, move this job to a self-hosted runner that has the GDK
  # installed rather than weakening the check.
  # ---------------------------------------------------------------------------
  godot-parse:
    name: Parse and import
    # The addon CMake presets target the Visual Studio 2022 generator.
    runs-on: windows-2022
    continue-on-error: true
    env:
      GODOT_VERSION: 4.6.2
      GODOT_ADDON_SUPPRESS_TELEMETRY: '1'
    steps:
      # No submodules here: the pin is read from the gitlink, and the addon
      # source is only fetched if the build has to run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-win64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = $env:GODOT_VERSION
          $name = "Godot_v$v-stable_win64"
          $url = "https://github.com/godotengine/godot/releases/download/$v-stable/${name}.exe.zip"
          New-Item -ItemType Directory -Force -Path godot-bin | Out-Null
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot-bin -Force

      - name: Account-save behavioral tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path godot-bin -Filter '*_console.exe' -Recurse |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'Godot console executable was not found.' }
          .\tools\run-save-tests.ps1 -Godot $exe

      - name: Addon inputs
        id: addon-inputs
        shell: pwsh
        run: |
          $pin = (git rev-parse HEAD:external/xbox-godot-sample).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $pin) { throw 'Could not read the external/xbox-godot-sample pin.' }
          "pin=$pin" >> $env:GITHUB_OUTPUT
          Write-Host "Addon pin: $pin"

      - name: Restore installed addons
        id: installed-addons
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: addons
          key: installed-addons-debug-windows-2022-${{ steps.addon-inputs.outputs.pin }}-${{ hashFiles('tools/sync_addons.ps1', 'tools/common.ps1', 'tools/addon-overrides/**') }}

      # Clone before restoring build output into the submodule directory;
      # git cannot initialize a submodule in a nonempty directory.
      - name: Initialize addon source
        if: steps.installed-addons.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git submodule update --init --recursive -- external/xbox-godot-sample
          if ($LASTEXITCODE -ne 0) { throw "Addon source checkout failed with exit code $LASTEXITCODE." }

      # The whole build tree, including build/vcpkg_installed. A cold restore of
      # the GDK and PlayFab SDKs dominates a build; a warm one makes the
      # incremental rebuild cheap.
      - name: Cache addon build tree
        if: steps.installed-addons.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: external/xbox-godot-sample/build
          key: addons-windows-2022-${{ steps.addon-inputs.outputs.pin }}
          restore-keys: addons-windows-2022-

      - name: Build addons
        if: steps.installed-addons.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\tools\sync_addons.ps1 -Configuration Debug -SkipConsoleRedist

      # Saved straight after the build rather than at job end, so a parse
      # failure later in the job does not throw away a good build.
      - name: Save installed addons
        if: steps.installed-addons.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: addons
          key: ${{ steps.installed-addons.outputs.cache-primary-key }}

      - name: Report addon source
        shell: pwsh
        run: |
          $source = if ('${{ steps.installed-addons.outputs.cache-hit }}' -eq 'true') {
            'Reused the addons built for this pin and these inputs; no native build.'
          } else {
            'Addon inputs changed or no cached build: built from source.'
          }
          Write-Host $source
          "**Addons** (${{ steps.addon-inputs.outputs.pin }}): $source" >> $env:GITHUB_STEP_SUMMARY

      - name: Parse and import project
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path godot-bin -Filter '*_console.exe' -Recurse |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            $exe = Get-ChildItem -Path godot-bin -Filter '*.exe' -Recurse |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "Using $exe"

          # .godot/ is gitignored, so a fresh checkout has no import cache. --import
          # runs the editor's import pass and quits; without it, --quit would *run*
          # the game against unimported resources instead.
          $importOut = & $exe --headless --path . --import 2>&1 | Out-String
          Write-Host $importOut
          if ($LASTEXITCODE -ne 0) {
            throw "Godot import exited with $LASTEXITCODE"
          }

          # Godot can report script parse failures on stderr while still
          # exiting 0, so the output is inspected as well as the exit code.
          $out = & $exe --headless --path . --quit 2>&1 | Out-String
          Write-Host $out
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            throw "Godot exited with $code"
          }
          if (($importOut + $out) -match 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file') {
            throw 'Project imported but reported script or resource errors.'
          }
          Write-Host 'Parse and import clean.' -ForegroundColor Green
